<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填写结果查看</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'PingFang SC',sans-serif; }
  body { background:linear-gradient(135deg,#f0e6ff,#ffe6f2); min-height:100vh; padding:24px 16px 60px; color:#333; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:#999; font-size:13px; margin-bottom:22px; }
  .gate { background:#fff; border-radius:22px; padding:30px 24px; box-shadow:0 8px 32px rgba(147,112,219,.18); text-align:center; }
  .gate input { width:100%; padding:14px; border:2px solid #eee; border-radius:14px; font-size:16px; outline:none; margin:14px 0; text-align:center; }
  .gate input:focus { border-color:#ff6b9d; }
  .btn { width:100%; padding:14px; border:none; border-radius:14px; background:#ff6b9d; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 4px 15px rgba(255,107,157,.3); }
  .btn:hover { filter:brightness(1.03); }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .bar .count { flex:1; color:#666; font-size:14px; }
  .bar .refresh { padding:9px 16px; border:2px solid #ffd0e0; background:#fff; color:#ff6b9d; border-radius:12px; font-size:13px; font-weight:bold; cursor:pointer; }
  .card { background:#fff; border-radius:18px; padding:18px 18px 8px; margin-bottom:14px; box-shadow:0 4px 18px rgba(147,112,219,.12); }
  .when { color:#c58; font-size:12px; margin-bottom:12px; }
  .row { padding:9px 12px; background:#faf7ff; border-radius:10px; margin-bottom:8px; font-size:14px; line-height:1.6; }
  .row b { color:#ff6b9d; }
  .empty, .err { text-align:center; color:#999; padding:50px 16px; line-height:1.9; font-size:14px; }
  .err { color:#d66; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 填写结果</h1>
  <div class="sub">仅自己查看</div>

  <!-- 密码门 -->
  <div class="gate" id="gate">
    <div>输入查看密码</div>
    <input type="password" id="pwd" placeholder="密码" onkeydown="if(event.key==='Enter')enter()">
    <button class="btn" onclick="enter()">进入</button>
  </div>

  <!-- 结果区 -->
  <div id="panel" class="hidden">
    <div class="bar">
      <div class="count" id="count"></div>
      <button class="refresh" onclick="load()">刷新</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  const ADMIN_CODE = "2580";   // 和邀请页一致，想改跟我说

  function enter(){
    const v = document.getElementById('pwd').value.trim();
    if(v !== ADMIN_CODE){ alert('密码不对哦'); return; }
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    load();
  }

  function fmt(iso){
    if(!iso) return '';
    const d = new Date(iso), p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }

  async function load(){
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    count.textContent = '加载中…';
    list.innerHTML = '';
    try{
      // 读同仓库的 replies.json，加时间戳防缓存
      const res = await fetch('./replies.json?t=' + Date.now());
      if(res.status === 404){
        count.textContent = '';
        list.innerHTML = '<div class="empty">还没有人填写。<br>等她填完，回来点“刷新”就能看到。</div>';
        return;
      }
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const arr = Array.isArray(data) ? data : [];
      if(!arr.length){
        count.textContent = '';
        list.innerHTML = '<div class="empty">还没有人填写。</div>';
        return;
      }
      count.textContent = `共 ${arr.length} 条`;
      list.innerHTML = arr.slice().reverse().map((r,i) => `
        <div class="card">
          <div class="when">第 ${arr.length - i} 条 · 填写时间：${fmt(r.ts)}</div>
          <div class="row"><b>日期：</b>${esc(r.date)}</div>
          <div class="row"><b>时间：</b>${esc(r.time)}</div>
          <div class="row"><b>美食：</b>${esc(r.food)}</div>
          <div class="row"><b>活动：</b>${esc(r.activity)}</div>
          <div class="row"><b>礼物：</b>${esc(r.gift || '—')}</div>
          <div class="row"><b>亲密申请：</b>${esc(r.hug || '—')}</div>
        </div>`).join('');
    }catch(e){
      count.textContent = '';
      list.innerHTML = `<div class="err">读取失败：${esc(e.message)}<br>如果刚部署，等 1-2 分钟 GitHub Pages 生效后再刷新。</div>`;
    }
  }
</script>
</body>
</html>
